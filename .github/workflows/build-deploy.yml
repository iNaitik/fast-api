name: Build and Deploy

on: [push, pull_request] #for all braches
  # push:
  #   branches: 
  #     - "main"  # provide the branch name you want to trigger the workflow on
  # pull_request:
  #   branches:
  #     - "main"  # provide the branch name you want to trigger the workflow on
jobs:
  enivornment:
    name: Testing
  env:
    DATABASE_HOSTNAME: ${{ secrets.DATABASE_HOSTNAME }}
    DATABASE_PORT: ${{ secrets.DATABASE_PORT }}
    DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
    DATABASE_NAME: ${{ secrets.DATABASE_NAME }}
    DATABASE_USERNAME: ${{ secrets.DATABASE_USERNAME }}
    SECRET_KEY: ${{ secrets.SECRET_KEY }}
    ALGORITHM: ${{ secrets.ALGORITHM }}
    ACCESS_TOKEN_EXPIRE_MINUTES: ${{ secrets.ACCESS_TOKEN_EXPIRE_MINUTES }}
  job1:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code # checkout the code from the repository means pulling the code from the repository to the runner machine
        uses: actions/checkout@v7
      - name: Setup Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: 3.11
      - name: Update pip
        run: python -m pip install --upgrade pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: 
          pip install pytest
          pytest
      
      
      